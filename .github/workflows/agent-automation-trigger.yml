name: AI Agent Automation Trigger

on:
  issues:
    types: [opened, edited]

jobs:
  trigger-agent:
    name: Notify AI Agent
    if: contains(github.event.issue.labels.*.name, 'automation-request')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Issue Request
        id: parse
        run: |
          echo "Processing automation request from issue #${{ github.event.issue.number }}"
          echo "Title: ${{ github.event.issue.title }}"
          echo "Triggering the framework-automation-generator agent..."

      # In a real environment, this is where you would call the LLM API or trigger 
      # the local MCP agent runner, passing the issue body as context.
      - name: Run framework-automation-generator
        run: |
          echo "Agent is evaluating the UI requirements and generating the following artifacts:"
          echo "- Cucumber Feature File"
          echo "- Step Definitions"
          echo "- Locator Modules"
          echo "- Page Objects"
          echo "If successful, the agent will open a Pull Request."

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 **AI Agent Acknowledged!** I am currently processing this test case. I will create a Pull Request with the generated Playwright automation shortly."
            })
